# The chart in standalone mode creates only namespaced RBAC for the lane EPP
# service accounts, but the EPP metrics port authenticates readers through
# TokenReview and SubjectAccessReview, which need cluster scope. Bind each lane
# account to the standard auth-delegator role, as the main release has.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thunder-lane-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: thunder-lane-a-epp
  namespace: llm-d-program-aware-scheduling
- kind: ServiceAccount
  name: thunder-lane-b-epp
  namespace: llm-d-program-aware-scheduling
- kind: ServiceAccount
  name: thunder-lane-c-epp
  namespace: llm-d-program-aware-scheduling
