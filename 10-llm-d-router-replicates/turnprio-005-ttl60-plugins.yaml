# Step 14 arm: llm-d-router upstream main (PR 2116) program-aware-fairness with
# the turn-priority strategy at its documented defaults: turnPriorityTimeWeight
# 0.05, inactivity reset 120 s, and the flow controller's default request TTL of
# 60 s, so under sustained contention a new session is shed (429) rather than
# dispatched ahead of deeper ones. Contention comes from the flow controller's
# default utilization saturation detector (queue depth >= 5 or KV >= 80 percent).
# agent-identity maps the bench's x-session-id header to the fairness ID, so
# one fairness ID is one session as the strategy requires. Placement follows
# the upstream sample (queue-scorer); on a single pod it is moot.
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: program-aware-fairness
  parameters:
    strategy: turn-priority
    turnPriorityTimeWeight: 0.05
    turnPriorityInactivitySeconds: 120
    evictionTtlSeconds: 3600
    evictionSweepSeconds: 300
- type: queue-scorer
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultPriorityBand:
    fairnessPolicyRef: program-aware-fairness
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: queue-scorer
  - pluginRef: max-score-picker
