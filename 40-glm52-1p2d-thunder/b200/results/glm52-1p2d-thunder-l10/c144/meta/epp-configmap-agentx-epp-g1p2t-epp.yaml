apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: glm52-2p1d-prefill-a
      namespace: bobzetian-llmd
      address: "10.0.47.167"
      port: "8200"
      labels:
        llm-d.ai/role: prefill
    - name: glm52-2p1d-decode
      namespace: bobzetian-llmd
      address: "10.0.40.43"
      port: "8000"
      labels:
        llm-d.ai/role: decode
    - name: glm52-1p2d-decode-b
      namespace: bobzetian-llmd
      address: "10.0.33.164"
      port: "8000"
      labels:
        llm-d.ai/role: decode
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # Step 40: llm-d-thunder-agent-simplified on the step 39 GLM-5.2 1P2D servers (glm52-2p1d-prefill-a on gw0s,
    # glm52-2p1d-decode on p3mf, glm52-1p2d-decode-b on t3gv, TP=8 each). Same EPP image as steps 34, 36, 38:
    # llm-d-router PR zetxqx/llm-d-router#15 (thunder-agent tracks only decode pods under P/D), commit 8d1fbc87,
    # image us-central1-docker.pkg.dev/bobzetian-gke-dev/bobinference/llm-d-router-endpoint-picker:
    # thunder-pd-8d1fbc87; disagg-profile-handler + always-disagg-pd-decider (P then D through the picked
    # decode pod's llm-d disagg sidecar); thunder lease 10 s, utilThreshold 1.0, forced admission 1800 s.
    # Against step 38:
    # 1. capacityTokens 1505088 as step 38, now per decode pod: both decode servers have a 1,505,088-token GPU
    #    KV pool (64 x 23517), only decode pods enter the ledger (bylabel.RunsDecode), so the ledger has two
    #    entries at 1505088 each. cacheInfoSpec stays dropped so the gate uses capacityTokens.
    # 2. Decode placement: the gate binds a new session to a decode pod with room when it admits it
    #    (admitLocked -> bindLocked), and the thunder scorer then gives that pod 1.0. A force-admitted new
    #    session that fits no pod is left to the scheduler, so the decode profile picks with
    #    weighted-random-picker: max-score-picker's tie-break counter is shared with the prefill profile's pick
    #    (picker.PickerRand.NextCounter, drawn once per profile), which in step 38 sent an unbound session's
    #    pick to the same pod almost every time.
    # 3. One prefill server: the prefill profile needs no affinity scorer (prefill-filter + max-score-picker).
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: openai-parser
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
    - type: core-metrics-extractor
      parameters:
        defaultEngine: vllm-no-cacheinfo
        engineConfigs:
        - name: vllm-no-cacheinfo
          queuedRequestsSpec: vllm:num_requests_waiting
          runningRequestsSpec: vllm:num_requests_running
          kvUsageSpec: vllm:kv_cache_usage_perc
          loraSpec: vllm:lora_requests_info
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: thunder-agent
      name: thunder
      parameters:
        capacityTokens: 1505088
        utilThreshold: 1.0
        idleLeaseSeconds: 10
        headWaitStarvationMs: 1800000
        evictionTtlSeconds: 3600
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: max-score-picker
    - type: weighted-random-picker
      name: decode-picker
    flowControl:
      defaultRequestTTL: "0s"
      saturationDetector:
        pluginRef: thunder
      defaultPriorityBand:
        fairnessPolicyRef: thunder
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: thunder
      - pluginRef: decode-picker
    requestHandler:
      parsers:
      - pluginRef: openai-parser
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
