apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: glm52-dep8-b-rank0
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8000"
    - name: glm52-dep8-b-rank1
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8001"
    - name: glm52-dep8-b-rank2
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8002"
    - name: glm52-dep8-b-rank3
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8003"
    - name: glm52-dep8-b-rank4
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8004"
    - name: glm52-dep8-b-rank5
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8005"
    - name: glm52-dep8-b-rank6
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8006"
    - name: glm52-dep8-b-rank7
      namespace: bobzetian-llmd
      address: "10.0.45.183"
      port: "8007"
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # Step 27, arm dep8-affinity: no llm-d-thunder-agent-simplified. Each session stays on one DP rank
    # (session-affinity-scorer, strategy session_id: the client's x-session-id header). A new session goes
    # to the rank with the fewest in-flight tokens (token-load-scorer, weight 0.1, so a known session's
    # rank always wins). Endpoints: the 8 rank ports of glm52-dep8-b, from a file (file-discovery, no RBAC
    # on a4-pr). EPP image: upstream main, ghcr.io/llm-d/llm-d-router-endpoint-picker:main pinned to
    # sha256:c0d60804... (commit 907c5fe8).
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: session-affinity-scorer
      parameters:
        strategy: session_id
    - type: inflight-load-producer
    - type: token-load-scorer
    - type: max-score-picker
    - type: single-profile-handler
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: session-affinity-scorer
        weight: 1
      - pluginRef: token-load-scorer
        weight: 0.1
      - pluginRef: max-score-picker
    dataLayer:
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
