apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: glm52-dep8-c-rank0
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8000"
    - name: glm52-dep8-c-rank1
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8001"
    - name: glm52-dep8-c-rank2
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8002"
    - name: glm52-dep8-c-rank3
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8003"
    - name: glm52-dep8-c-rank4
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8004"
    - name: glm52-dep8-c-rank5
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8005"
    - name: glm52-dep8-c-rank6
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8006"
    - name: glm52-dep8-c-rank7
      namespace: bobzetian-llmd
      address: "10.0.34.129"
      port: "8007"
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # Step 27, arm dep8-thunder-l10: llm-d-thunder-agent-simplified on the 8 DP ranks of glm52-dep8-c, one
    # endpoint per rank. Thunder pins each session to its rank and admits a session only if it fits that
    # rank. capacityTokens = one rank's vLLM kv_cache_size_tokens (818175 on glm52-dep8-a, 2026-10-15); the
    # engine config drops cacheInfoSpec, so this value is used, as in step 26. Lease 10 s, forced admission
    # after 1800 s, as the TP=8 runs of step 25. A new session goes to the rank with the fewest in-flight
    # tokens (token-load-scorer, weight 0.1, as in dep8-affinity). EPP image: upstream main, pinned to
    # sha256:c0d60804... (commit 907c5fe8). Endpoints from a file (file-discovery, no RBAC on a4-pr).
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
    - type: core-metrics-extractor
      parameters:
        defaultEngine: vllm-no-cacheinfo
        engineConfigs:
        - name: vllm-no-cacheinfo
          queuedRequestsSpec: vllm:num_requests_waiting
          runningRequestsSpec: vllm:num_requests_running
          kvUsageSpec: vllm:kv_cache_usage_perc
          loraSpec: vllm:lora_requests_info
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: thunder-agent
      name: thunder
      parameters:
        capacityTokens: 818175
        utilThreshold: 1.0
        idleLeaseSeconds: 10
        headWaitStarvationMs: 1800000
        evictionTtlSeconds: 3600
    - type: inflight-load-producer
    - type: token-load-scorer
    - type: max-score-picker
    - type: single-profile-handler
    flowControl:
      defaultRequestTTL: "0s"
      saturationDetector:
        pluginRef: thunder
      defaultPriorityBand:
        fairnessPolicyRef: thunder
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: thunder
        weight: 1
      - pluginRef: token-load-scorer
        weight: 0.1
      - pluginRef: max-score-picker
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
