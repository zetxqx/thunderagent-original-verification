# Shared disk for the AgentX client Jobs: HuggingFace cache (corpus + tokenizer),
# the reconstructed-dataset mmap cache, and every run's artifacts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentx-data
  namespace: llm-d-program-aware-scheduling
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 200Gi
