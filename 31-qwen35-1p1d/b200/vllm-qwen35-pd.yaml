# Step 31: minimal P/D (1 prefill + 1 decode) for Qwen3.5-397B-A17B-FP8 on one a4-highgpu-8g node
# (5qjv, which caches the checkpoint), each server TP=4 on 4 B200 + 4 RDMA NICs (qwen35-tp4-gpu-nic).
# Model flags are step 26's (vllm-qwen35.yaml.tmpl) and identical on P and D, so the NIXL KV layouts
# match (FP8 KV, MTP 3, 2128-token blocks), with these changes:
#   - KV transfer: MultiConnector = NixlConnector (P kv_producer, D kv_consumer, bidirectional_kv_xfer
#     false since our client/sidecar is one-way P -> D) + OffloadingConnector (CPU tier, 387 GiB per
#     server = 415538085888 bytes, server-wide, as step 26). --kv-offloading-size is NOT used: in vLLM
#     v0.31 it overwrites kv_transfer_config.kv_connector with OffloadingConnector and would drop NIXL.
#   - --mamba-cache-mode all is passed on both P and D, though vLLM v0.31 falls back to 'align' at
#     startup for Qwen3.5 (Qwen3_5MoeMTP does not implement SupportsMambaPrefixCaching; model_executor/
#     models/config.py:654).
#   - bidirectional_kv_xfer is false so D does not pin finished requests' blocks for 480 s waiting for a
#     D -> P readback our client/sidecar never uses.
#   - vLLM listens on 8200 in both pods (decode: the disagg sidecar takes 8000, as in llm-d's P/D
#     recipe); one port lets run-point.sh read metrics from and reset both servers.
#   - Hybrid-model settings from llm-d's Mamba-hybrid P/D guide (nemotron-3-ultra):
#     VLLM_SSM_CONV_STATE_LAYOUT=DS, VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0.
#   - RDMA: IPC_LOCK for memory registration; UCX_TLS excludes cuda_ipc (the two pods see different
#     GPUs, so CUDA IPC between them cannot work; KV goes over the RDMA NICs).
# The two pods differ only in: name/role labels, NIXL kv_role, MAX_NUM_SEQS, and the decode sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen35-pd-prefill
  namespace: bobzetian-llmd
  labels: {llm-d.ai/role: prefill, stack: qwen35-1p1d}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 3600
  selector:
    matchLabels: {app: qwen35-pd-prefill}
  template:
    metadata:
      labels: {app: qwen35-pd-prefill, llm-d.ai/role: prefill, stack: qwen35-1p1d}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: a4-highgpu-8g
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-5qjv
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      resourceClaims:
      - name: gpu-nic
        resourceClaimTemplateName: qwen35-tp4-gpu-nic
      terminationGracePeriodSeconds: 60
      containers:
      - name: modelserver
        image: vllm/vllm-openai:v0.31.0
        command: [bash, -c]
        args:
        - |
          # vllm-project/vllm#62862 fix toggle; see the decode pod.
          if [ "${VLLM_PR62862:-0}" = 1 ]; then
            SP=/usr/local/lib/python3.12/dist-packages/vllm
            cp /pr62862/scheduler.py "$SP/v1/core/sched/scheduler.py"
            cp /pr62862/multi_connector.py "$SP/distributed/kv_transfer/kv_connector/v1/multi_connector.py"
            echo "VLLM_PR62862: applied zetxqx/vllm#1"
          fi
          exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
            --revision ea5b4f81096f3901c91dea97f81324302495781d \
            --served-model-name Qwen/Qwen3.5-397B-A17B-FP8 \
            --host 0.0.0.0 --port 8200 \
            --tensor-parallel-size 4 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --max-num-seqs "$MAX_NUM_SEQS" \
            --max-num-batched-tokens 16384 \
            --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION" \
            --enable-prefix-caching \
            --mamba-cache-mode all \
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
            --kv-transfer-config "$KV_TRANSFER_CONFIG" \
            --reasoning-parser qwen3 \
            --enable-auto-tool-choice --tool-call-parser qwen3_coder \
            --enable-prompt-tokens-details
        env:
        - {name: VLLM_PR62862, value: "1"}
        - {name: MAX_NUM_SEQS, value: "64"}
        - {name: GPU_MEMORY_UTILIZATION, value: "0.8"}
        - name: KV_TRANSFER_CONFIG
          value: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"bidirectional_kv_xfer":false}},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":415538085888,"lazy_offload":true}}]}}'
        - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        - {name: VLLM_SSM_CONV_STATE_LAYOUT, value: DS}
        - {name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL, value: "0"}
        - {name: UCX_TLS, value: "^cuda_ipc"}
        - {name: UCX_IB_ROCE_REACHABILITY_MODE, value: all}
        - {name: NCCL_CUMEM_ENABLE, value: "1"}
        - {name: NCCL_NET_PLUGIN, value: none}
        - {name: NCCL_TUNER_PLUGIN, value: none}
        - {name: NCCL_SOCKET_IFNAME, value: eth0}
        - {name: VLLM_SERVER_DEV_MODE, value: "1"}
        - {name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE, value: "1800"}
        ports:
        - {name: http, containerPort: 8200}
        - {name: nixl, containerPort: 5600}
        startupProbe:
          httpGet: {path: /health, port: 8200}
          periodSeconds: 10
          failureThreshold: 540
        readinessProbe:
          httpGet: {path: /health, port: 8200}
          periodSeconds: 10
        securityContext:
          capabilities: {add: [IPC_LOCK]}
        resources:
          requests: {cpu: "50", memory: 700Gi}
          limits: {memory: 900Gi}
          claims:
          - name: gpu-nic
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: hf-cache, mountPath: /root/.cache/huggingface}
        - {name: nvidia-install-dir, mountPath: /usr/local/nvidia/lib64}
        - {name: pr62862, mountPath: /pr62862}
      volumes:
      - name: pr62862
        configMap: {name: vllm-pr62862}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 450Gi}
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/bobzetian-hf-cache
          type: DirectoryOrCreate
      - name: nvidia-install-dir
        hostPath: {path: /home/kubernetes/bin/nvidia/lib64}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen35-pd-decode
  namespace: bobzetian-llmd
  labels: {llm-d.ai/role: decode, stack: qwen35-1p1d}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 3600
  selector:
    matchLabels: {app: qwen35-pd-decode}
  template:
    metadata:
      labels: {app: qwen35-pd-decode, llm-d.ai/role: decode, stack: qwen35-1p1d}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: a4-highgpu-8g
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-5qjv
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      resourceClaims:
      - name: gpu-nic
        resourceClaimTemplateName: qwen35-tp4-gpu-nic
      terminationGracePeriodSeconds: 60
      initContainers:
      # llm-d disagg sidecar (native sidecar): receives the request from envoy on 8000; when the EPP
      # picked a prefill pod (x-llm-d-prefiller-host-port), sends the prefill there first, then runs
      # decode on the local vLLM (8200, the sidecar's default --model-server-port), which pulls the KV
      # over NIXL.
      - name: routing-proxy
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
        args: [--port=8000, --kv-connector=nixlv2, --secure-serving=false, --zap-log-level=1]
        ports:
        - {name: sidecar, containerPort: 8000}
        restartPolicy: Always
        securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
      containers:
      - name: modelserver
        image: vllm/vllm-openai:v0.31.0
        command: [bash, -c]
        args:
        - |
          # Work around vLLM v0.31.0 MultiConnector bug (vllm-project/vllm#62862): with
          # VLLM_PR62862=1, overlay the fix from zetxqx/vllm#1 (pr62862/, ported onto v0.31.0;
          # the image's two files are byte-identical to v0.31.0). D then reuses its local
          # FullAttention prefix blocks and pulls only the uncached suffix + 1 Mamba block over NIXL.
          if [ "${VLLM_PR62862:-0}" = 1 ]; then
            SP=/usr/local/lib/python3.12/dist-packages/vllm
            cp /pr62862/scheduler.py "$SP/v1/core/sched/scheduler.py"
            cp /pr62862/multi_connector.py "$SP/distributed/kv_transfer/kv_connector/v1/multi_connector.py"
            echo "VLLM_PR62862: applied zetxqx/vllm#1"
          fi
          exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
            --revision ea5b4f81096f3901c91dea97f81324302495781d \
            --served-model-name Qwen/Qwen3.5-397B-A17B-FP8 \
            --host 0.0.0.0 --port 8200 \
            --tensor-parallel-size 4 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --max-num-seqs "$MAX_NUM_SEQS" \
            --max-num-batched-tokens 16384 \
            --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION" \
            --enable-prefix-caching \
            --mamba-cache-mode all \
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
            --kv-transfer-config "$KV_TRANSFER_CONFIG" \
            --reasoning-parser qwen3 \
            --enable-auto-tool-choice --tool-call-parser qwen3_coder \
            --enable-prompt-tokens-details
        env:
        - {name: VLLM_PR62862, value: "1"}
        - {name: MAX_NUM_SEQS, value: "128"}
        - {name: GPU_MEMORY_UTILIZATION, value: "0.8"}
        - name: KV_TRANSFER_CONFIG
          value: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bidirectional_kv_xfer":false}},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":415538085888,"lazy_offload":true}}]}}'
        - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        - {name: VLLM_SSM_CONV_STATE_LAYOUT, value: DS}
        - {name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL, value: "0"}
        - {name: UCX_TLS, value: "^cuda_ipc"}
        - {name: UCX_IB_ROCE_REACHABILITY_MODE, value: all}
        - {name: NCCL_CUMEM_ENABLE, value: "1"}
        - {name: NCCL_NET_PLUGIN, value: none}
        - {name: NCCL_TUNER_PLUGIN, value: none}
        - {name: NCCL_SOCKET_IFNAME, value: eth0}
        - {name: VLLM_SERVER_DEV_MODE, value: "1"}
        - {name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE, value: "1800"}
        ports:
        - {name: http, containerPort: 8200}
        - {name: nixl, containerPort: 5600}
        startupProbe:
          httpGet: {path: /health, port: 8200}
          periodSeconds: 10
          failureThreshold: 540
        readinessProbe:
          httpGet: {path: /health, port: 8200}
          periodSeconds: 10
        securityContext:
          capabilities: {add: [IPC_LOCK]}
        resources:
          requests: {cpu: "50", memory: 700Gi}
          limits: {memory: 900Gi}
          claims:
          - name: gpu-nic
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: hf-cache, mountPath: /root/.cache/huggingface}
        - {name: nvidia-install-dir, mountPath: /usr/local/nvidia/lib64}
        - {name: pr62862, mountPath: /pr62862}
      volumes:
      - name: pr62862
        configMap: {name: vllm-pr62862}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 450Gi}
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/bobzetian-hf-cache
          type: DirectoryOrCreate
      - name: nvidia-install-dir
        hostPath: {path: /home/kubernetes/bin/nvidia/lib64}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen35-pd-prefill
  namespace: bobzetian-llmd
spec:
  selector: {app: qwen35-pd-prefill}
  ports:
  - {name: http, port: 8200, targetPort: 8200}
---
# 8000: the decode sidecar (what the EPP routes to); 8200: decode vLLM (metrics, cache reset).
apiVersion: v1
kind: Service
metadata:
  name: qwen35-pd-decode
  namespace: bobzetian-llmd
spec:
  selector: {app: qwen35-pd-decode}
  ports:
  - {name: sidecar, port: 8000, targetPort: 8000}
  - {name: http, port: 8200, targetPort: 8200}
