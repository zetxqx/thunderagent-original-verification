spec:
  progressDeadlineSeconds: 3600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qwen35-pd-decode
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: qwen35-pd-decode
        llm-d.ai/role: decode
        stack: qwen35-1p1d
    spec:
      containers:
      - args:
        - |
          # Work around vLLM v0.31.0 MultiConnector bug (vllm-project/vllm#62862): with
          # VLLM_PR62862=1, overlay the fix from zetxqx/vllm#1 (pr62862/, ported onto v0.31.0;
          # the image's two files are byte-identical to v0.31.0). D then reuses its local
          # FullAttention prefix blocks and pulls only the uncached suffix + 1 Mamba block over NIXL.
          if [ "${VLLM_PR62862:-0}" = 1 ]; then
            SP=/usr/local/lib/python3.12/dist-packages/vllm
            cp /pr62862/scheduler.py "$SP/v1/core/sched/scheduler.py"
            cp /pr62862/multi_connector.py "$SP/distributed/kv_transfer/kv_connector/v1/multi_connector.py"
            echo "VLLM_PR62862: applied zetxqx/vllm#1"
          fi
          exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
            --revision ea5b4f81096f3901c91dea97f81324302495781d \
            --served-model-name Qwen/Qwen3.5-397B-A17B-FP8 \
            --host 0.0.0.0 --port 8200 \
            --tensor-parallel-size 4 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --max-num-seqs "$MAX_NUM_SEQS" \
            --max-num-batched-tokens 16384 \
            --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION" \
            --enable-prefix-caching \
            --mamba-cache-mode all \
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
            --kv-transfer-config "$KV_TRANSFER_CONFIG" \
            --reasoning-parser qwen3 \
            --enable-auto-tool-choice --tool-call-parser qwen3_coder \
            --enable-prompt-tokens-details
        command:
        - bash
        - -c
        env:
        - name: VLLM_PR62862
          value: "0"
        - name: MAX_NUM_SEQS
          value: "128"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.8"
        - name: KV_TRANSFER_CONFIG
          value: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bidirectional_kv_xfer":false}},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":415538085888,"lazy_offload":true}}]}}'
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: VLLM_SSM_CONV_STATE_LAYOUT
          value: DS
        - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
          value: "0"
        - name: UCX_TLS
          value: ^cuda_ipc
        - name: UCX_IB_ROCE_REACHABILITY_MODE
          value: all
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: NCCL_NET_PLUGIN
          value: none
        - name: NCCL_TUNER_PLUGIN
          value: none
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: "1800"
        image: vllm/vllm-openai:v0.31.0
        imagePullPolicy: IfNotPresent
        name: modelserver
        ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8200
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          claims:
          - name: gpu-nic
          limits:
            memory: 900Gi
          requests:
            cpu: "50"
            memory: 700Gi
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        startupProbe:
          failureThreshold: 540
          httpGet:
            path: /health
            port: 8200
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        - mountPath: /usr/local/nvidia/lib64
          name: nvidia-install-dir
        - mountPath: /pr62862
          name: pr62862
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - --port=8000
        - --kv-connector=nixlv2
        - --secure-serving=false
        - --zap-log-level=1
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v1.0.0
        imagePullPolicy: IfNotPresent
        name: routing-proxy
        ports:
        - containerPort: 8000
          name: sidecar
          protocol: TCP
        resources: {}
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-5qjv
        node.kubernetes.io/instance-type: a4-highgpu-8g
      resourceClaims:
      - name: gpu-nic
        resourceClaimTemplateName: qwen35-tp4-gpu-nic
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 420
          name: vllm-pr62862
        name: pr62862
      - emptyDir:
          medium: Memory
          sizeLimit: 450Gi
        name: dshm
      - hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/bobzetian-hf-cache
          type: DirectoryOrCreate
        name: hf-cache
      - hostPath:
          path: /home/kubernetes/bin/nvidia/lib64
          type: ""
        name: nvidia-install-dir
