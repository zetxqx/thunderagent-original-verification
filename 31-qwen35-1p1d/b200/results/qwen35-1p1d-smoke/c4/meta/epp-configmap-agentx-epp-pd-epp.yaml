apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: qwen35-pd-prefill
      namespace: bobzetian-llmd
      address: "10.0.37.252"
      port: "8200"
      labels:
        llm-d.ai/role: prefill
    - name: qwen35-pd-decode
      namespace: bobzetian-llmd
      address: "10.0.47.41"
      port: "8000"
      labels:
        llm-d.ai/role: decode
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # Step 31: llm-d-router v1.0.0 (ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0) for a minimal
    # P/D pair (qwen35-pd-prefill, qwen35-pd-decode). Endpoints come from a file (file-discovery, no
    # Kubernetes API, so no RBAC, which our account cannot create on a4-pr); each endpoint carries its
    # llm-d.ai/role label, which prefill-filter and decode-filter read.
    #
    # disagg-profile-handler runs the decode profile (always), then the prefill profile when the prefill
    # decider approves; the EPP passes the picked prefill endpoint to the decode sidecar in
    # x-llm-d-prefiller-host-port. The decider here is always-disagg-pd-decider: every request takes the
    # remote-prefill path, which is what the smoke test has to exercise (NIXL transfer P -> D). For
    # agentic runs, prefix-based-pd-decider (prefill remotely only when the uncached suffix on the decode
    # pod is long) is the arm to compare.
    #
    # No flow control and no thunder-agent yet: v1.0.0's thunder-agent puts prefill pods in its ledger
    # (see the step 31 README). With one endpoint per role, the profiles need no scorers.
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: max-score-picker
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
    dataLayer:
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
