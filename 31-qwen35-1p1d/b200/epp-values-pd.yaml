# Extra Helm values for the step 31 P/D lane EPP on cluster a4-pr (render-lane-epp.sh EXTRA_VALUES):
# llm-d-router v1.0.0 from ghcr.io, node pool pool-1, no HF_TOKEN env (no tokenizer in the plugin
# config), and the endpoints file with one endpoint per role. Addresses are the Services' ClusterIPs:
#   prefill 10.0.37.252:8200  vLLM
#   decode  10.0.47.41:8000   the disagg sidecar (it proxies every other path, /metrics included,
#                             to the decode vLLM on 8200)
router:
  epp:
    image:
      registry: ghcr.io
      repository: llm-d/llm-d-router-endpoint-picker
      tag: v1.0.0
    env: []
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - {key: cloud.google.com/gke-nodepool, operator: In, values: [pool-1]}
    pluginsCustomConfig:
      endpoints.yaml: |
        endpoints:
        - name: qwen35-pd-prefill
          namespace: bobzetian-llmd
          address: "10.0.37.252"
          port: "8200"
          labels:
            llm-d.ai/role: prefill
        - name: qwen35-pd-decode
          namespace: bobzetian-llmd
          address: "10.0.47.41"
          port: "8000"
          labels:
            llm-d.ai/role: decode
