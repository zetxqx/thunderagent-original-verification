# Step 38: llm-d-thunder-agent-simplified on the step 37 GLM-5.2 2P1D servers (glm52-2p1d-prefill-a on
# gw0s, glm52-2p1d-prefill-b on t3gv, glm52-2p1d-decode on p3mf, TP=8 each). Same EPP image as steps
# 34 and 36: llm-d-router PR zetxqx/llm-d-router#15 (thunder-agent tracks only decode pods under P/D),
# commit 8d1fbc87, image us-central1-docker.pkg.dev/bobzetian-gke-dev/bobinference/
# llm-d-router-endpoint-picker:thunder-pd-8d1fbc87; disagg-profile-handler + always-disagg-pd-decider
# (P then D through the decode pod's llm-d disagg sidecar); thunder lease 10 s, utilThreshold 1.0,
# forced admission 1800 s. Two changes from step 36:
# 1. capacityTokens 1505088, the DECODE server's GPU KV pool (its vLLM kv_cache_size_tokens, 64 x 23517;
#    each prefill server has 1572864). Only decode pods enter the ledger (bylabel.RunsDecode), so the one
#    ledger entry is the decode pod and this is its ceiling; with one decode server every session counts
#    against it. cacheInfoSpec stays dropped so the gate uses capacityTokens.
# 2. The prefill profile pins a session to one prefill server (session-affinity-scorer, session_id
#    strategy on x-session-id, profileName prefill): with two prefill servers and no scorer,
#    max-score-picker would break the tie at random on every turn and lose the session's prefix on the
#    other server. First turn: random of the two; later turns: the same one (as step 37's proxy hash).
#    The prefill profile picks with weighted-random-picker, not max-score-picker: max-score-picker breaks
#    ties by rotating with a counter shared by every picker (picker.PickerRand.NextCounter), and each
#    request draws it twice (decode profile, then prefill profile), so the prefill pick of an unbound
#    session saw the same parity almost every time; the first c=96 run sent 87% of requests to one
#    prefill server (results/maxscore-skewed/). weighted-random-picker keeps only the scored pod when the
#    session is bound (zero-score pods are excluded) and shuffles uniformly when all scores are zero.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- name: vllm-endpoints
  type: file-discovery
  parameters:
    path: /config/endpoints.yaml
    watchFile: true
- type: openai-parser
- type: metrics-data-source
  parameters:
    scheme: http
    path: /metrics
- type: core-metrics-extractor
  parameters:
    defaultEngine: vllm-no-cacheinfo
    engineConfigs:
    - name: vllm-no-cacheinfo
      queuedRequestsSpec: vllm:num_requests_waiting
      runningRequestsSpec: vllm:num_requests_running
      kvUsageSpec: vllm:kv_cache_usage_perc
      loraSpec: vllm:lora_requests_info
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  name: thunder
  parameters:
    capacityTokens: 1505088
    utilThreshold: 1.0
    idleLeaseSeconds: 10
    headWaitStarvationMs: 1800000
    evictionTtlSeconds: 3600
- type: session-affinity-scorer
  name: prefill-affinity
  parameters:
    strategy: session_id
    profileName: prefill
    sessionIdConfig:
      sources:
      - header: x-session-id
      evictionTtlSeconds: 3600
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciders:
      prefill: always-disagg-pd-decider
- type: prefill-filter
- type: decode-filter
- type: max-score-picker
- type: weighted-random-picker
  name: prefill-picker
flowControl:
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder
  defaultPriorityBand:
    fairnessPolicyRef: thunder
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: prefill-affinity
  - pluginRef: prefill-picker
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: thunder
  - pluginRef: max-score-picker
requestHandler:
  parsers:
  - pluginRef: openai-parser
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  discovery:
    endpoints:
      pluginRef: vllm-endpoints
