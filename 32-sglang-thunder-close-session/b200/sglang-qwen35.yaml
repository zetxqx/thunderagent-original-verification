apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-qwen35-a
  namespace: bobzetian-llmd
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 3600
  selector:
    matchLabels: {app: sglang-qwen35-a}
  template:
    metadata:
      labels:
        app: sglang-qwen35-a
        llm-d.ai/engine-type: sglang
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      imagePullSecrets:
      - name: artifact-registry-secret
      nodeSelector:
        node.kubernetes.io/instance-type: a4-highgpu-8g
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-13z6
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: qwen35-tp4-gpu
      terminationGracePeriodSeconds: 60
      containers:
      - name: modelserver
        image: docker.io/lmsysorg/sglang@sha256:ddae0e399d3d94f7827f16183301cf8dac4cf0eae0ef25590b7dac5881d713d8
        command: [bash, -c]
        args:
        - |
          exec python3 -m sglang.launch_server \
            --model-path /root/.cache/huggingface/hub/models--Qwen--Qwen3.5-397B-A17B-FP8/snapshots/ea5b4f81096f3901c91dea97f81324302495781d \
            --served-model-name Qwen/Qwen3.5-397B-A17B-FP8 \
            --host 0.0.0.0 --port 8000 \
            --tp 4 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --mem-fraction-static 0.8 \
            --chunked-prefill-size 16384 \
            --enable-session-radix-cache \
            --enable-metrics \
            --enable-cache-report \
            --uvicorn-access-log-exclude-prefixes /metrics /health \
            --stream-response-default-include-usage \
            --reasoning-parser qwen3 \
            --tool-call-parser qwen3_coder
        env:
        - {name: SGLANG_TIMEOUT_KEEP_ALIVE, value: "1800"}
        - {name: NCCL_CUMEM_ENABLE, value: "1"}
        - {name: NCCL_NET_PLUGIN, value: none}
        - {name: NCCL_TUNER_PLUGIN, value: none}
        - {name: NCCL_SOCKET_IFNAME, value: eth0}
        ports:
        - {name: http, containerPort: 8000}
        startupProbe:
          httpGet: {path: /v1/models, port: 8000}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 540
        readinessProbe:
          httpGet: {path: /v1/models, port: 8000}
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests: {cpu: "50", memory: 700Gi}
          limits: {memory: 900Gi}
          claims:
          - name: gpu
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: hf-cache, mountPath: /root/.cache/huggingface}
        - {name: nvidia-install-dir, mountPath: /usr/local/nvidia/lib64}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 450Gi}
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/bobzetian-hf-cache
          type: DirectoryOrCreate
      - name: nvidia-install-dir
        hostPath: {path: /home/kubernetes/bin/nvidia/lib64}
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-qwen35-a
  namespace: bobzetian-llmd
spec:
  selector: {app: sglang-qwen35-a}
  ports:
  - {name: http, port: 8000, targetPort: 8000}
---
