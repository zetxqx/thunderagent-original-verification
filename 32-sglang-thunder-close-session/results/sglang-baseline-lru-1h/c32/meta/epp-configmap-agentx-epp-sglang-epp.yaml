apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: sglang-qwen35-a
      namespace: bobzetian-llmd
      address: "10.0.35.169"
      port: "8000"
      labels:
        llm-d.ai/engine-type: sglang
    - name: sglang-qwen35-b
      namespace: bobzetian-llmd
      address: "10.0.37.190"
      port: "8000"
      labels:
        llm-d.ai/engine-type: sglang
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: sglang-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: openai-parser
    - type: sglanghttp-parser
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
    - type: core-metrics-extractor
      parameters:
        defaultEngine: sglang
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: thunder-agent
      name: thunder
      parameters:
        capacityTokens: 4194304
        utilThreshold: 0.85
        idleLeaseSeconds: 30
        headWaitStarvationMs: 1800000
        evictionTtlSeconds: 3600
        closeSession: false
    - type: max-score-picker
    - type: single-profile-handler
    flowControl:
      defaultRequestTTL: "0s"
      saturationDetector:
        pluginRef: thunder
      defaultPriorityBand:
        fairnessPolicyRef: thunder
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: thunder
      - pluginRef: max-score-picker
    requestHandler:
      parsers:
      - pluginRef: openai-parser
      - pluginRef: sglanghttp-parser
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      discovery:
        endpoints:
          pluginRef: sglang-endpoints
kind: ConfigMap
metadata:
  annotations:
