# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-epp-uf-epp
  namespace: bobzetian-llmd
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  endpoints.yaml: |
    endpoints:
    - name: qwen35-tp4-f
      namespace: bobzetian-llmd
      address: "10.0.34.161"
      port: "8000"
  thunder-plugins.yaml: |
    # Step 30: step 28's llm-d-router v1.0.0 turn-priority config, unchanged, in front of one
    # Qwen3.5-397B-A17B-FP8 TP=4 server (ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0): flow
    # control and the program-aware fairness policy in its turn-priority strategy (upstream #2116).
    # Every session is one program: agent-identity reads aiperf's X-Session-ID, and the director
    # copies it to the fairness ID. When the pool is saturated, requests wait at the router and the
    # deepest session goes first: score = turns already dispatched + turnPriorityTimeWeight x head
    # wait in seconds (defaults: 0.05 per second, a session idle for 120 s counts as turn one).
    # Saturation is v1.0.0's default utilization detector (not configured here, so the loader adds
    # it): saturated when vLLM's waiting queue reaches 5 or its KV cache usage reaches 0.8.
    # defaultRequestTTL 0: a waiting request is never shed (the default 60 s would turn waits into
    # errors, and AgentX stops a run at 10% failed requests); the envoy ext_proc timeout is 2400 s.
    # Endpoints come from a file (file-discovery: no Kubernetes API, so no RBAC, which our account
    # cannot create on a4-pr), as in step 25.
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: program-aware-fairness
      parameters:
        strategy: turn-priority
    - type: max-score-picker
    - type: single-profile-handler
    flowControl:
      defaultRequestTTL: "0s"
      defaultPriorityBand:
        fairnessPolicyRef: program-aware-fairness
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: max-score-picker
    dataLayer:
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
