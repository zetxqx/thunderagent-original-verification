---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentx-epp-uf-epp
  namespace: bobzetian-llmd
  labels:
    app.kubernetes.io/name: agentx-epp-uf-epp
    app.kubernetes.io/version: "0.0.0"
    llm-d.ai/igw-mode: llm-d-router-standalone
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    #
    # With replicas > 1 this also means the Deployment never reports Available=True,
    # because standby replicas stay NotReady by design. Set router.epp.deploymentStrategy
    # if that blocks your tooling; see "Multi-replica EPP and Helm --wait" in the chart README.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-standalone: agentx-epp-uf-epp
  template:
    metadata:
      labels:
        llm-d-router-standalone: agentx-epp-uf-epp
        llm-d.ai/igw-mode: llm-d-router-standalone
      annotations:
        checksum/config: c5836dc99231aca5d65e4e2538cff378c7744adf4f2621c9a02af41410400729
    spec:

      serviceAccountName: agentx-epp-uf-epp
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: envoy-proxy
          image: docker.io/envoyproxy/envoy:distroless-v1.33.2
          imagePullPolicy: IfNotPresent
          command:
            - "envoy"
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          env:
          - name: NS_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          ports:
          - containerPort: 8081
            name: http-8081
          - containerPort: 19001
            name: metrics-19001
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /ready
              port: 19001
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          # Give endpoint removal time to propagate before SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - mountPath: /etc/envoy
              name: config
              readOnly: true
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
              - --endpoint-selector
              - "agentx-lane=uf"
              - --endpoint-target-ports
              - "8000"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/thunder-plugins.yaml"
              - --grpc-health-port
              - "9003"
              # Pass additional flags via the router.epp.flags field in values.yaml.
              # Render them as --flag=value so boolean values are parsed correctly.
              - "--allow-experimental-plugins=true"
              - "--v=2"
              - --tracing=false
          resources:
            
            limits:
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: liveness
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: readiness
            periodSeconds: 2
          # Give endpoint removal time to propagate before SIGTERM.
          # Kubelet performs the delay without a shell in the distroless EPP image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
        
      volumes:
        - configMap:
            items:
            - key: envoy.yaml
              path: envoy.yaml
            name: agentx-epp-uf-envoy
          name: config
        - name: plugins-config-volume
          configMap:
            name: agentx-epp-uf-epp
        
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - pool-1
