apiVersion: batch/v1
kind: Job
metadata:
  name: agentx-c20-baseline-60m
  namespace: llm-d-program-aware-scheduling
  labels: {app: agentx-bench, agentx-label: "baseline-60m", agentx-conc: "20"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: agentx-bench}
    spec:
      restartPolicy: Never
      
      nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      
      containers:
      - name: aiperf
        image: us-central1-docker.pkg.dev/bobzetian-gke-dev/bobinference/agentx-harness:agentx-v1.0.6
        # The image is distroless: bash and the aiperf venv only, no coreutils.
        args:
        - |
          aiperf profile --scenario agentx \
            --url http://agentx-lane-c:8000 --model Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8 --tokenizer Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8 \
            --concurrency 20 --public-dataset semianalysis_cc_traces_weka_062126_256k  \
            --server-metrics http://10.100.2.12:8000/metrics \
            --server-metrics-formats json csv parquet \
            --output-artifact-dir /data/results/baseline-60m/c20/aiperf_artifacts 
          rc=$?
          aiperf analyze swim-lane /data/results/baseline-60m/c20/aiperf_artifacts -c 20 --html \
            || echo "swim-lane render failed"
          exit $rc
        env:
        - {name: HF_HOME, value: /data/hf}
        - {name: AIPERF_DATASET_MMAP_CACHE_DIR, value: /data/mmap}
        - {name: AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID, value: "false"}
        - {name: AIPERF_SERVER_METRICS_COLLECTION_INTERVAL, value: "1.0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:
          requests: {cpu: "4", memory: 32Gi}
          limits: {memory: 32Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: agentx-data-c}
      
