apiVersion: batch/v1
kind: Job
metadata:
  name: agentx-c128-qwen35-1p1d-baseline
  namespace: bobzetian-llmd
  labels: {app: agentx-bench, agentx-label: "qwen35-1p1d-baseline", agentx-conc: "128"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: agentx-bench}
    spec:
      restartPolicy: Never
      
      nodeSelector: {cloud.google.com/gke-nodepool: pool-1}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      
      containers:
      - name: aiperf
        image: us-central1-docker.pkg.dev/bobzetian-gke-dev/bobinference/agentx-harness:agentx-v1.0.6
        # The image is distroless: bash and the aiperf venv only, no coreutils.
        args:
        - |
          aiperf profile --scenario agentx \
            --url http://pd-proxy:8000 --model Qwen/Qwen3.5-397B-A17B-FP8 --tokenizer Qwen/Qwen3.5-397B-A17B-FP8 \
            --concurrency 128 --public-dataset semianalysis_cc_traces_weka_062126_256k --benchmark-duration 3600 \
            --server-metrics http://10.4.11.64:8200/metrics http://10.4.11.65:8200/metrics \
            --server-metrics-formats json csv parquet \
            --output-artifact-dir /data/results/qwen35-1p1d-baseline/c128/aiperf_artifacts --tokenizer-trust-remote-code
          rc=$?
          aiperf analyze swim-lane /data/results/qwen35-1p1d-baseline/c128/aiperf_artifacts -c 128 --html \
            || echo "swim-lane render failed"
          exit $rc
        env:
        - {name: HF_HOME, value: /data/hf}
        - {name: AIPERF_DATASET_MMAP_CACHE_DIR, value: /data/mmap}
        - {name: AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID, value: "false"}
        - {name: AIPERF_SERVER_METRICS_COLLECTION_INTERVAL, value: "1.0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:
          requests: {cpu: "3", memory: 12Gi}
          limits: {memory: 32Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: agentx-data-qb}
      
