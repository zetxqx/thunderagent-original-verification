# EPP plugin config for the epp-thunder-origin-w8 arm: origin-only resume with
# the origin wait capped at 8 s (originWaitMaxMs), no reordering. The wait-cost
# curve shows a paused prefix survives about 10 to 12 s on its pod at 32
# sessions per pod, so a program waits while its prefix is almost certainly
# warm and moves to the pod with the most room before the wait is wasted
# (proposal Part 8, layer 1). Needs thunder-agent-v7 or later.
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  name: thunder
  parameters:
    capacityTokens: 2237040
    utilThreshold: 1.0
    actingHalfLifeSeconds: 1
    bufferTokensPerProgram: 100
    pauseSweepSeconds: 5
    kvUsageCorrection: false
    resumePlacement: origin-only
    originWaitMaxMs: 8000
    headWaitStarvationMs: 1800000
    evictionTtlSeconds: 3600
    evictionSweepSeconds: 300
    sessionFinalHeader: x-session-final
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder
  defaultPriorityBand:
    fairnessPolicyRef: thunder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: thunder
  - pluginRef: max-score-picker
