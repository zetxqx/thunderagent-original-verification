# Step 16 arm thunder-min-hl10-s1: the thunder-min-hl10 arm (idle decay
# half-life 10 s) with the pause sweep every 1 s instead of 5 s, the lever the
# minimal design names first for a long-wait tail (design section 8): sessions
# idle for a short tool call can be paused, so an over-full pod gets back under
# the line sooner. Otherwise the minimal thunder-agent (llm-d-router
# thunder-agent-minimal, image thunder-agent-min-*) with the same semantics
# as the step 13 thunder-origin arm (origin-only is the only placement in the
# minimal plugin), in the six keys it accepts.
# actingHalfLifeSeconds was renamed idleDecayHalfLifeSeconds; the removed
# keys (bufferTokensPerProgram, kvUsageCorrection, evictionSweepSeconds,
# sessionFinalHeader) are rejected by the strict decoder.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  name: thunder
  parameters:
    capacityTokens: 2237040
    utilThreshold: 1.0
    idleDecayHalfLifeSeconds: 10
    pauseSweepSeconds: 1
    headWaitStarvationMs: 1800000
    evictionTtlSeconds: 3600
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder
  defaultPriorityBand:
    fairnessPolicyRef: thunder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: thunder
  - pluginRef: max-score-picker
