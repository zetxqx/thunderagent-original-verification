# EPP plugin config for the epp-thunder-origin-u15 arm: origin-only resume
# plus the urgent tier at 15 s (proposal Part 3 Option B in its stronger form,
# with Part 1 aging): a paused or new head that has waited 15 s is ordered
# ahead of all non-urgent heads and may take any pod with room. Forced
# admission stays at 1800 s. Needs thunder-agent-v5 or later.
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  name: thunder
  parameters:
    capacityTokens: 2237040
    utilThreshold: 1.0
    actingHalfLifeSeconds: 1
    bufferTokensPerProgram: 100
    pauseSweepSeconds: 5
    kvUsageCorrection: false
    resumePlacement: origin-only
    urgentWaitMs: 15000
    urgentMove: true                  # v5 semantics; v6 splits the move out of urgentWaitMs
    headWaitStarvationMs: 1800000
    evictionTtlSeconds: 3600
    evictionSweepSeconds: 300
    sessionFinalHeader: x-session-final
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder
  defaultPriorityBand:
    fairnessPolicyRef: thunder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: thunder
  - pluginRef: max-score-picker
