# Step 37 (from step 35), router-less 2P1D: vLLM's NIXL toy proxy (toy_proxy_server.py, ConfigMap pd-proxy-script)
# in front of glm52-2p1d-prefill-a/-b:8200 and glm52-2p1d-decode:8200 (decode vLLM directly, not the llm-d
# sidecar on 8000). Every request: P with max_tokens=1 + do_remote_decode, then D with P's
# kv_transfer_params, streamed back. Runs on 5qjv (vLLM image already cached there), no GPUs.
# Not labeled stack=glm52-2p1d, so run-point.sh's DECODE_SELECTOR does not reset or scrape it.
# ConfigMap: kubectl create configmap pd-proxy-script --from-file=toy_proxy_server.py
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: bobzetian-llmd
  labels: {app: pd-proxy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pd-proxy}
  template:
    metadata:
      labels: {app: pd-proxy}
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-p3mf
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: proxy
        image: vllm/vllm-openai:v0.31.0
        command: [python3, /proxy/toy_proxy_server.py]
        args:
        - --host=0.0.0.0
        - --port=8000
        - --prefiller-hosts
        - glm52-2p1d-prefill-a
        - glm52-2p1d-prefill-b
        - --prefiller-ports
        - "8200"
        - "8200"
        - --decoder-host=glm52-2p1d-decode
        - --decoder-port=8200
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /healthcheck, port: 8000}
          periodSeconds: 5
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {memory: 16Gi}
        volumeMounts:
        - {name: script, mountPath: /proxy}
      volumes:
      - name: script
        configMap: {name: pd-proxy-script}
---
apiVersion: v1
kind: Service
metadata:
  name: pd-proxy
  namespace: bobzetian-llmd
spec:
  selector: {app: pd-proxy}
  ports:
  - {name: http, port: 8000, targetPort: 8000}
