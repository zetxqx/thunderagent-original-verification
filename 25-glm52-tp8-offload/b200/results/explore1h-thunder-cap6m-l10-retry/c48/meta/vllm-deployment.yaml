spec:
  progressDeadlineSeconds: 3600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: glm52-tp8-b
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: glm52-tp8-b
    spec:
      containers:
      - args:
        - |
          exec vllm serve nvidia/GLM-5.2-NVFP4 \
            --revision aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa \
            --served-model-name nvidia/GLM-5.2-NVFP4 \
            --host 0.0.0.0 --port 8000 \
            --tensor-parallel-size 8 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --max-model-len 1048576 \
            --max-num-seqs "$MAX_NUM_SEQS" \
            --max-num-batched-tokens 8192 \
            --gpu-memory-utilization 0.8 \
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
            --kv-offloading-size 820 --kv-offloading-backend native \
            --enable-auto-tool-choice --tool-call-parser glm47 \
            --enable-prompt-tokens-details
        command:
        - bash
        - -c
        env:
        - name: MAX_NUM_SEQS
          value: "64"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: NCCL_NET_PLUGIN
          value: none
        - name: NCCL_TUNER_PLUGIN
          value: none
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: NCCL_DEBUG
          value: INFO
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        image: vllm/vllm-openai:v0.31.0
        imagePullPolicy: IfNotPresent
        name: modelserver
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          claims:
          - name: gpu
          limits:
            memory: 1600Gi
          requests:
            cpu: "100"
            memory: 1300Gi
        startupProbe:
          failureThreshold: 540
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        - mountPath: /usr/local/nvidia/lib64
          name: nvidia-install-dir
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: gke-a4-pr-a4-highgpu-8g-a4-pool-1-13a7a362-13z6
        node.kubernetes.io/instance-type: a4-highgpu-8g
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: glm52-tp8-gpu
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 900Gi
        name: dshm
      - hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/bobzetian-hf-cache
          type: DirectoryOrCreate
        name: hf-cache
      - hostPath:
          path: /home/kubernetes/bin/nvidia/lib64
          type: ""
        name: nvidia-install-dir
