apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: glm52-tp8-d
      namespace: bobzetian-llmd
      address: "10.0.44.102"
      port: "8000"
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # thunder-agent gate as in PR3 (llm-d/llm-d-router#3076, image
    # llm-d-router-endpoint-picker:thunder-agent-pr3-a025437b-produces, PR3 plus the
    # Produces() fix). Same pipeline as
    # deploy/config/thunderagent-config.yaml in that branch, with capacityTokens set
    # to this pool's real KV size (the fallback when cache_config_info is absent).
    # Step 25: 1667712 = 26058 GPU blocks x 64, the smallest pool seen across the
    # B200 restarts (1667712 to 1694080 tokens).
    # Endpoints come from a file (file-discovery: no Kubernetes API, so no RBAC,
    # which our account cannot create on a4-pr). The file lists the vLLM Service
    # ClusterIP, stable across the per-point restarts of the single vLLM pod.
    # Timeouts: the 1800 s backstop needs defaultRequestTTL 0 (no queue eviction),
    # envoy ext_proc message_timeout above 1800 s (2400 s in the lane values), and a
    # client that waits longer than that. PR3's own default backstop is 30 s, below
    # the 60 s default TTL; if you use it, drop defaultRequestTTL and say so.
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: thunder-agent
      name: thunder
      parameters:
        capacityTokens: 1667712
        utilThreshold: 1.0
        idleLeaseSeconds: 30
        headWaitStarvationMs: 1800000
        evictionTtlSeconds: 3600
    - type: max-score-picker
    - type: single-profile-handler
    flowControl:
      defaultRequestTTL: "0s"
      saturationDetector:
        pluginRef: thunder
      defaultPriorityBand:
        fairnessPolicyRef: thunder
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: thunder
      - pluginRef: max-score-picker
    dataLayer:
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
