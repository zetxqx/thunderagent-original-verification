      containers:
      - args:
        - |
          VW=$(python3 -c 'import vllm, os; print(os.path.dirname(vllm.__file__))')/v1/kv_offload/cpu/gpu_worker.py
          cp /patch/gpu_worker_v031_bounded.py "$VW" && echo "patched $VW (max load submit descriptors=$VLLM_KV_OFFLOAD_MAX_LOAD_SUBMIT_DESCRIPTORS)"
          exec vllm serve nvidia/GLM-5.2-NVFP4 \
            --revision aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa \
            --served-model-name nvidia/GLM-5.2-NVFP4 \
            --host 0.0.0.0 --port 8000 \
            --tensor-parallel-size 8 \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --max-model-len 1048576 \
            --max-num-seqs "$MAX_NUM_SEQS" \
            --max-num-batched-tokens 8192 \
            --gpu-memory-utilization 0.8 \
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
            --kv-offloading-size 820 --kv-offloading-backend native \
            --enable-auto-tool-choice --tool-call-parser glm47 \
            --enable-prompt-tokens-details
