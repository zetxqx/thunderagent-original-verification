# AgentX smoke point (c=1, 120 s, 8 traces) against the B200 server.
# Same client, image and collection flags as the agentic-benchmark skill's
# run-point.sh; dataset is the uncapped corpus InferenceX uses for GLM-5.2
# (1M context). --unsafe-override marks the result as not submission-valid.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentx-c1-smoke1
  namespace: bobzetian-llmd
  labels: {app: agentx-bench, agentx-label: smoke1, agentx-conc: "1"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: agentx-bench}
    spec:
      restartPolicy: Never
      nodeSelector: {cloud.google.com/gke-nodepool: pool-1}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
      - name: aiperf
        image: us-central1-docker.pkg.dev/bobzetian-gke-dev/bobinference/agentx-harness:agentx-v1.0.6
        # The image is distroless: bash and the aiperf venv only, no coreutils.
        args:
        - |
          aiperf profile --scenario agentx \
            --url http://glm52-tp8:8000 --model nvidia/GLM-5.2-NVFP4 --tokenizer nvidia/GLM-5.2-NVFP4 \
            --tokenizer-trust-remote-code \
            --concurrency 1 --public-dataset semianalysis_cc_traces_weka_062126 --benchmark-duration 120 \
            --server-metrics http://glm52-tp8:8000/metrics \
            --server-metrics-formats json csv parquet \
            --output-artifact-dir /data/results/smoke1/c1/aiperf_artifacts \
            --unsafe-override --num-dataset-entries 8 --warmup-requests-per-lane 1
          rc=$?
          aiperf analyze swim-lane /data/results/smoke1/c1/aiperf_artifacts -c 1 --html \
            || echo "swim-lane render failed"
          exit $rc
        env:
        - {name: HF_HOME, value: /data/hf}
        - {name: AIPERF_DATASET_MMAP_CACHE_DIR, value: /data/mmap}
        - {name: AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID, value: "false"}
        - {name: AIPERF_HTTP_TCP_USER_TIMEOUT, value: "900000"}
        - {name: AIPERF_SERVER_METRICS_COLLECTION_INTERVAL, value: "1.0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:
          requests: {cpu: "8", memory: 32Gi}
          limits: {memory: 32Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: agentx-data}
