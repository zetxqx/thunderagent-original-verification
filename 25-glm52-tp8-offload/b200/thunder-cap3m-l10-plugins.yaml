# Variant thunder-cap3m-l10 (2026-10-13): gate capacity 2x the GPU KV pool, so the gate
# admits more sessions than the GPU holds and the CPU tier (about 18.2M tokens: MLA, one copy
# for the 8 GPUs) keeps the rest. Idle lease 10 s, backstop 1800 s, as thunder-gpu-l10.
# The vLLM engine config below drops cacheInfoSpec, so the gate cannot read the GPU block
# count and falls back to capacityTokens: 3145728 = 2 x 1572864 (24576 GPU blocks x 64).
# Image llm-d-router-endpoint-picker:thunder-agent-pr3-a025437b-produces (PR3 plus the
# Produces() fix); endpoints from a file (file-discovery, no RBAC on a4-pr).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- name: vllm-endpoints
  type: file-discovery
  parameters:
    path: /config/endpoints.yaml
    watchFile: true
- type: metrics-data-source
  parameters:
    scheme: http
    path: /metrics
- type: core-metrics-extractor
  parameters:
    defaultEngine: vllm-no-cacheinfo
    engineConfigs:
    - name: vllm-no-cacheinfo
      queuedRequestsSpec: vllm:num_requests_waiting
      runningRequestsSpec: vllm:num_requests_running
      kvUsageSpec: vllm:kv_cache_usage_perc
      loraSpec: vllm:lora_requests_info
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  name: thunder
  parameters:
    capacityTokens: 3145728
    utilThreshold: 1.0
    idleLeaseSeconds: 10
    headWaitStarvationMs: 1800000
    evictionTtlSeconds: 3600
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder
  defaultPriorityBand:
    fairnessPolicyRef: thunder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: thunder
  - pluginRef: max-score-picker
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  discovery:
    endpoints:
      pluginRef: vllm-endpoints
