# IMEX domain for the two A4X nodes of the TP=8 group, so NCCL can use
# multi-node NVLink (MNNVL) across the GB200 trays.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: glm52-tp8
  namespace: bobzetiana4x
spec:
  numNodes: 2
  channel:
    resourceClaimTemplate:
      name: glm52-tp8-channel
