# Step 29: llm-d-router v1.0.0 (ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0) turn-priority
# in front of a GLM-5.2 DEP=8 server: step 28's flow-control config on top of step 27's
# dep8-affinity scheduling profile, so the only difference from step 27's dep8-affinity arm
# is the flow-control layer (program-aware fairness, turn-priority strategy).
#
# Endpoints: the 8 rank API servers of one glm52-dep8 server (ports 8000 to 8007), from a file
# (file-discovery: no Kubernetes API, so no RBAC, which our account cannot create on a4-pr).
#
# Flow control (as step 28): every session is one program (agent-identity reads aiperf's
# X-Session-ID). When the pool is saturated, requests wait at the router and the deepest
# session goes first: score = turns already dispatched + 0.05 x head wait in seconds (defaults;
# a session idle for 120 s counts as turn one). defaultRequestTTL 0: no waiting request is shed.
# Saturation: the utilization detector, pool saturation = average over the 8 ranks of
# max(waiting / 5, kv_usage / 0.8), the same thresholds as step 28's (defaulted) detector.
#
# Scheduling (as step 27's dep8-affinity): a session stays on the rank that served it
# (session-affinity-scorer, strategy session_id, weight 1); a new session goes to the rank
# with the fewest in-flight tokens (token-load-scorer, weight 0.1, so a known session's rank
# always wins).
#
# headroom 100 on the detector: with flow control on, the loader also injects the detector as a
# Filter into the scheduling profile, and by default (headroom 0) it removes every rank whose
# waiting queue exceeds 5 or whose KV usage exceeds 0.8 from the candidates before the scorers
# run. With offload on, the ranks sit above 0.8 most of the time, so the default filter would
# move sessions off their rank (a cache miss on the new rank, a dead copy on the old one) and
# the arm would measure filter-induced migration, not turn-priority. headroom 100 lifts the
# filter limits to queue 505 and KV 1.0 (capped), so the filter never removes a rank for load;
# it does not change the saturation signal (thresholds 5 and 0.8 are unchanged).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- name: vllm-endpoints
  type: file-discovery
  parameters:
    path: /config/endpoints.yaml
    watchFile: true
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: program-aware-fairness
  parameters:
    strategy: turn-priority
- type: utilization-detector
  parameters:
    queueDepthThreshold: 5
    kvCacheUtilThreshold: 0.8
    headroom: 100
- type: session-affinity-scorer
  parameters:
    strategy: session_id
- type: inflight-load-producer
- type: token-load-scorer
- type: max-score-picker
- type: single-profile-handler
flowControl:
  defaultRequestTTL: "0s"
  defaultPriorityBand:
    fairnessPolicyRef: program-aware-fairness
  saturationDetector:
    pluginRef: utilization-detector
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: session-affinity-scorer
    weight: 1
  - pluginRef: token-load-scorer
    weight: 0.1
  - pluginRef: max-score-picker
dataLayer:
  discovery:
    endpoints:
      pluginRef: vllm-endpoints
