# Four B200 per TP=4 server, from DRA (cluster a4-pr exposes GPUs as gpu.nvidia.com devices).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: qwen35-tp4-gpu
  namespace: bobzetian-llmd
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 4
