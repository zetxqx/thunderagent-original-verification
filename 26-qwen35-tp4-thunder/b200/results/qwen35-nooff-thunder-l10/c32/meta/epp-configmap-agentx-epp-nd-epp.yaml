apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  endpoints.yaml: |
    endpoints:
    - name: qwen35-nooff-d
      namespace: bobzetian-llmd
      address: "10.0.33.229"
      port: "8000"
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  thunder-plugins.yaml: |
    # llm-d-thunder-agent-simplified for step 26 part 2 (CPU tier off), lane nd (qwen35-nooff-d): capacity 4843063 tokens, the
    # kv_cache_size_tokens vLLM reports for that server. vLLM's hybrid (Gated DeltaNet + attention) KV cache
    # uses 2128-token blocks, and block_size x num_gpu_blocks would overstate the token capacity by about
    # 13%, so the engine config below drops cacheInfoSpec and the gate uses capacityTokens. Idle lease 10 s,
    # forced admission after 1800 s. EPP image: upstream main, ghcr.io/llm-d/llm-d-router-endpoint-picker:main
    # pinned to sha256:c0d60804... (commit 907c5fe8). Endpoints from a file (file-discovery, no RBAC on a4-pr).
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    featureGates:
    - flowControl
    plugins:
    - name: vllm-endpoints
      type: file-discovery
      parameters:
        path: /config/endpoints.yaml
        watchFile: true
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
    - type: core-metrics-extractor
      parameters:
        defaultEngine: vllm-no-cacheinfo
        engineConfigs:
        - name: vllm-no-cacheinfo
          queuedRequestsSpec: vllm:num_requests_waiting
          runningRequestsSpec: vllm:num_requests_running
          kvUsageSpec: vllm:kv_cache_usage_perc
          loraSpec: vllm:lora_requests_info
    - type: agent-identity
      parameters:
        additionalSessionHeaders:
        - x-session-id
    - type: thunder-agent
      name: thunder
      parameters:
        capacityTokens: 4843063
        utilThreshold: 1.0
        idleLeaseSeconds: 10
        headWaitStarvationMs: 1800000
        evictionTtlSeconds: 3600
    - type: max-score-picker
    - type: single-profile-handler
    flowControl:
      defaultRequestTTL: "0s"
      saturationDetector:
        pluginRef: thunder
      defaultPriorityBand:
        fairnessPolicyRef: thunder
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: thunder
      - pluginRef: max-score-picker
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      discovery:
        endpoints:
          pluginRef: vllm-endpoints
kind: ConfigMap
